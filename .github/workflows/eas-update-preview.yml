name: EAS Update Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Debug node version
        run: node -v

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm i -g eas-cli@latest

      - name: Publish OTA update to preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel preview --environment preview --non-interactive --message "main:${{ github.sha }}"